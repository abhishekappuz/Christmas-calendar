<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Calendar</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1812;--bg2:#050c08;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--ink:#f5eddd;--mut:#bdb29d;--gold:#e3be58;--onGold:#1a1205;--red:#b3261e;--grn:#1f6b45;--ov1:rgba(5,12,8,.45);--ov2:rgba(5,12,8,.92);--sh:0 10px 30px rgba(0,0,0,.45);--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}.door{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);min-height:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;z-index:0}
.veil{position:fixed;inset:0;z-index:0;background:linear-gradient(var(--ov1),var(--ov2) 62%)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
main{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:14px 16px 40px}
nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font:600 .72rem var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 13px;font:500 .74rem var(--sans);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:hover,.chip.on{border-color:var(--gold)}.chip.on{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
nav .chip{margin-left:4px}
.hero{text-align:center;padding:6px 0 26px}#sp{height:175px;margin:0 auto 4px;width:160px}
.eyebrow{font:600 .72rem var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
h1{font:700 clamp(2.2rem,9vw,4.6rem)/1.02 var(--serif);margin:12px 0 4px;letter-spacing:.02em;text-wrap:balance}
.sub{font:italic 500 clamp(1.1rem,4vw,1.6rem) var(--serif);color:var(--mut)}
.rule{width:150px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 10px}
.dr{font:500 .75rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.cd{display:flex;justify-content:center;gap:8px;margin:24px 0 6px}
.cd div{min-width:66px;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cd b{display:block;font:700 2rem/1 var(--serif);color:var(--gold)}.cd span{font:500 .62rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.cdm{font:italic 500 1.3rem var(--serif);color:var(--gold);margin:6px 0}
.panel{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin:8px 0 22px}
@media(max-width:720px){.panel{grid-template-columns:1fr}}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh)}
.glass h3{margin:0 0 6px;font:600 .68rem var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.glass p{margin:0;line-height:1.75}
.today{display:flex;gap:14px;align-items:center}
.ring{--p:0;flex:none;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring i{width:58px;height:58px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 1.25rem var(--serif);font-style:normal}
.btn{background:var(--gold);color:var(--onGold);border:0;border-radius:99px;padding:10px 22px;font:600 .74rem var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:6px 4px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:26px 16px}
.door{cursor:pointer;perspective:900px}
.dw{position:relative;aspect-ratio:3/4.2;border-radius:50% 50% 4px 4px/22% 22% 4px 4px;padding:8px;background:linear-gradient(140deg,#8a6038,#3a2412 50%,#6f4a26);box-shadow:0 12px 14px -6px rgba(0,0,0,.75),0 2px 0 #1e1208,inset 0 0 0 1px rgba(255,214,140,.35),inset 0 3px 4px rgba(255,220,160,.25);transition:transform .3s}
.door:hover .dw{transform:translateY(-4px)}
.in,.lf{position:absolute;inset:8px;border-radius:inherit}
.in{background:radial-gradient(ellipse at 50% 75%,#fff3c4,#f0b84a 38%,#5a3510 100%);box-shadow:inset 0 0 16px rgba(0,0,0,.75);display:grid;place-items:center;color:#8a5a10;font-size:1.6rem}
.lf{transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,.7,.3,1);overflow:hidden;background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 8px),repeating-linear-gradient(0deg,rgba(255,230,180,.05) 0 2px,transparent 2px 5px),linear-gradient(100deg,#8c5a2c,#b07a40 45%,#7c4c22);box-shadow:inset 0 0 0 2px rgba(60,30,8,.65),inset 3px 0 6px rgba(255,220,170,.25)}
.lf::before,.lf::after{content:"";position:absolute;left:14%;right:14%;background:#97642f;box-shadow:inset 1px 1px 3px rgba(0,0,0,.6),inset -1px -1px 1px rgba(255,220,170,.3),0 1px 0 rgba(255,220,170,.25);border-radius:3px}
.lf::before{top:10%;height:31%;border-radius:45% 45% 3px 3px/30% 30% 3px 3px}.lf::after{bottom:8%;height:31%}
.pl{position:absolute;left:50%;top:42%;transform:translateX(-50%);text-align:center;line-height:1;padding:4px 9px;border-radius:3px;color:#3a2504;background:linear-gradient(#f0d57a,#b58a22);box-shadow:0 2px 4px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.35);z-index:2}
.pl b{display:block;font:700 1.3rem var(--serif)}.pl s{display:block;text-decoration:none;font:600 .5rem var(--sans);letter-spacing:.16em}
.kn{position:absolute;right:8%;top:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b0,#c9a227 55%,#6d5208);box-shadow:1px 2px 3px rgba(0,0,0,.7);z-index:2}
.hg{position:absolute;left:0;width:5px;height:13px;background:linear-gradient(90deg,#6d5208,#e7c766,#6d5208);z-index:2}.hg.a{top:20%}.hg.b{bottom:20%}
.lk{position:absolute;left:50%;bottom:21%;width:15px;height:12px;margin-left:-7px;background:#c9a227;border-radius:2px;z-index:2;box-shadow:0 1px 2px #000}
.lk::before{content:"";position:absolute;left:2px;top:-8px;width:7px;height:8px;border:2px solid #c9a227;border-bottom:0;border-radius:6px 6px 0 0}
.door.open .lf{transform:rotateY(-75deg)}
.door.seen .dw{box-shadow:0 12px 14px -6px rgba(0,0,0,.75),0 0 0 2px rgba(227,190,88,.8)}
.door.lock .dw::before{content:"";position:absolute;inset:8px;border-radius:inherit;background:rgba(0,0,0,.38);z-index:3;pointer-events:none}
.door.pg .dw::after{content:"★";position:absolute;top:-8px;right:-5px;width:22px;height:22px;border-radius:50%;background:#b71c1c;color:#ffd54f;font-size:.75rem;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.6);z-index:4}
.door.now .dw{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(227,190,88,.35),var(--sh)}}
.cap{text-align:center;font:600 .66rem/1.3 var(--sans);letter-spacing:.07em;margin-top:9px;min-height:2.6em;color:var(--gold);text-transform:uppercase}
.empty{text-align:center;color:var(--mut);grid-column:1/-1}
footer{text-align:center;margin-top:44px;color:var(--mut);font-size:.78rem}
footer button{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.78rem}
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,8,5,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.box{background:var(--bg);border:1px solid var(--gold);border-radius:20px;padding:24px 22px;width:100%;max-width:470px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,.8,.3,1)}
.box.wide{max-width:720px}
@keyframes pop{from{transform:translateY(22px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.box h2{font:700 1.8rem/1.15 var(--serif);color:var(--gold);text-align:center;margin:4px 0 12px}
.tag{text-align:center;font:600 .66rem var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.pn{min-height:120px;text-align:center;font:500 1.15rem/1.7 var(--serif)}
.pn .vq{font-size:1.35rem;font-style:italic;margin:0 0 10px}.ref{margin:0;font:600 .74rem var(--sans);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:.9rem var(--sans)}
.opts .ok{background:#2e7d4f;color:#fff;border-color:#2e7d4f}.opts .no{background:#a33;color:#fff;border-color:#a33}
.sc{font:700 1.9rem var(--serif);letter-spacing:.25em;color:var(--gold)}
.res{min-height:1.4em;font:500 .9rem var(--sans);color:var(--mut)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:.9rem var(--sans);margin:3px 0 10px}
select option{color:#000}textarea{min-height:70px;resize:vertical}
.arena{position:relative;height:190px;border:1px dashed var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.star{position:absolute;background:none;border:0;font-size:2.2rem;color:var(--gold)}
.adm{text-align:left;font-family:var(--sans)}.adm h2{margin-bottom:4px}
.adm label{display:block;font:500 .74rem var(--sans);color:var(--mut)}
.adm fieldset{border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:12px 14px}
.adm legend{padding:0 8px;font:600 .68rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.chk{display:flex!important;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.dnav{display:flex;gap:6px;align-items:center}.dnav select{margin:0}.dnav .btn{margin:0;padding:9px 14px}
#santa{position:absolute;z-index:9;width:160px;height:219px;left:0;top:0;pointer-events:none;display:none}#santa canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}#bub{position:absolute;left:80%;top:8%;white-space:nowrap;background:#fffaf0;color:#2a1a0a;font:600 .85rem var(--sans);padding:8px 14px;border-radius:16px 16px 16px 3px;box-shadow:var(--sh);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:.3s}#bub.on{opacity:1;transform:none}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}.kb button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);font:600 .85rem var(--sans)}.kb .ok{background:#2e7d4f;color:#fff}.kb .no{background:#a33;color:#fff}.kb button:disabled{opacity:.75}.lives{margin:2px 0 4px;letter-spacing:.1em}
.gc{width:100%;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#10261c,#07110c)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mc{aspect-ratio:1;border-radius:12px;border:1px solid var(--gold);background:repeating-linear-gradient(45deg,#7d1d22 0 6px,#5e1519 6px 12px);font-size:1.9rem;position:relative}.mc span{opacity:0;transition:.2s}.mc:not(.up)::after{content:"✦";color:var(--gold);position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}.mc.up{background:var(--card)}.mc.up span{opacity:1}.mc.ok{border-color:#2e7d4f;box-shadow:0 0 12px rgba(46,125,79,.7)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#161616;color:#fff;padding:10px 20px;border-radius:99px;font:.82rem var(--sans);z-index:40;display:none;box-shadow:var(--sh)}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media(prefers-reduced-motion:reduce){.door.now .dw{animation:none}.lf{transition:none}}
</style></head>

<main>
<nav><span class="brand" id="br">Christmas Calendar</span><span><button class="chip" id="mus">Music: Off</button><button class="chip" id="fx">Effects: On</button></span></nav>

<script>
const $=s=>document.querySelector(s);
const SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
const D=JSON.parse($("#data").textContent);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const KEY="csi-adv-seen";
let seen=[],preview=false,busy=false,cur=0,filter="all";
try{seen=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(seen))}catch(e){}};

const NOW=new Date(),Y=NOW.getMonth()===0?NOW.getFullYear()-1:NOW.getFullYear();
const T=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const dOf=i=>new Date(Y,11,i+1);
const unl=i=>preview||!!(D.days[i]&&D.days[i].u)||dOf(i)<=T;
const fmt=(d,o)=>d.toLocaleDateString("en-GB",o);
const lab=i=>fmt(dOf(i),{day:"numeric",month:"short"});
const tIdx=Math.round((T-new Date(Y,11,1))/864e5);
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2600)}
function render(){
  const n=D.days.length,open=seen.filter(i=>i<n).length;
  document.title=D.church+" – "+(D.tag||"Christmas Calendar");
  $("#br").textContent=D.church;$("#tag").textContent=D.tag||"Christmas Calendar";$("#ttl").textContent=D.church;
  $("#sub").textContent=D.sub||"";$("#dr").textContent=D.dates||(fmt(dOf(0),{day:"numeric",month:"long"})+" – "+fmt(dOf(n-1),{day:"numeric",month:"long"}));
  $("#bg").src=D.img||"";$("#about").innerHTML=nl(D.about);$("#ft").textContent=D.footer||"";
  const pct=Math.round(open/n*100),inR=tIdx>=0&&tIdx<n;
  $("#today").innerHTML='<div class="ring" style="--p:'+pct+'"><i>'+open+'</i></div><div><h3>'+(inR?"Today · "+lab(tIdx):"Your journey")+'</h3><p>'+(inR?(D.days[tIdx].t?esc(D.days[tIdx].t)+" is waiting behind today’s door.":"Today’s door is ready to open."):(tIdx<0?"The first door opens in "+(-tIdx)+" day"+(tIdx==-1?"":"s")+".":"Thank you for journeying with us."))+'</p>'+(inR?'<button class="btn" id="otd">Open today’s door</button>':'')+'</div>';
  if(inR)$("#otd").onclick=()=>{const el=$("#grid").children[tIdx];if(el)el.click()};
  $("#flt").innerHTML="";
  [["all","All doors"],["seen","Opened"],["avail","Available"],["pg","Programs"]].forEach(([k,l])=>{const b=document.createElement("button");b.className="chip"+(filter===k?" on":"");b.textContent=l;b.onclick=()=>{filter=k;render()};$("#flt").appendChild(b)});
  const g=$("#grid");g.innerHTML="";let shown=0;
  D.days.forEach((d,i)=>{
    const u=unl(i),s=seen.includes(i);
    if((filter==="seen"&&!s)||(filter==="avail"&&!u)||(filter==="pg"&&!d.t))return;
    shown++;const el=document.createElement("div");
    el.className="door"+(s?" seen":"")+(u?"":" lock")+(d.t?" pg":"")+(i===tIdx?" now":"");
    el.innerHTML='<div class="dw"><div class="in">'+(u?"✦":"")+'</div><div class="lf"><i class="hg a"></i><i class="hg b"></i><div class="pl"><b>'+dOf(i).getDate()+'</b><s>'+fmt(dOf(i),{month:"short"}).toUpperCase()+'</s></div><i class="kn"></i>'+(u?"":'<i class="lk"></i>')+'</div></div><div class="cap">'+esc(d.t)+'</div>';
    el.onclick=()=>u?go(i,el):toast("This door opens on "+lab(i));
    g.appendChild(el)});
  if(!shown)g.innerHTML='<p class="empty">Nothing here yet.</p>';
}
function cdown(){
  const x=new Date(Y,11,25)-new Date(),c=$("#cd");
  if(x<=0&&x>-864e5){c.innerHTML="";$("#cdm").textContent="Merry Christmas! ✦";return}
  if(x<=0){c.innerHTML="";$("#cdm").textContent="Wishing you a blessed New Year";return}
  const v=[[Math.floor(x/864e5),"Days"],[Math.floor(x/36e5)%24,"Hours"],[Math.floor(x/6e4)%60,"Minutes"],[Math.floor(x/1e3)%60,"Seconds"]];
  c.innerHTML=v.map(a=>"<div><b>"+a[0]+"</b><span>"+a[1]+"</span></div>").join("");$("#cdm").textContent="until Christmas Day"}
cdown();setInterval(cdown,1e3);

// snow + confetti
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
(function(){const c=$("#snow"),x=c.getContext("2d");let w,h,f=[];
  const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener("resize",rs);
  for(let i=0;i<(rm?0:70);i++)f.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.2+.6,v:Math.random()*.7+.3,d:Math.random()*6});
  (function t(){x.clearRect(0,0,w,h);x.fillStyle="rgba(255,255,255,.75)";
    f.forEach(p=>{p.y+=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.4;if(p.y>h){p.y=-5;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(t)})()})();
function confetti(){if(rm||!fxOn)return;const c=$("#fxc"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=["#e3be58","#c0392b","#2e8b57","#fff","#f1d58a"],p=[...Array(90)].map(()=>({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:Math.random()*7+3,c:cs[Math.random()*5|0],r:Math.random()*6}));
  let n=0;(function t(){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.vy+=.35;a.x+=a.vx;a.y+=a.vy;a.r+=.2;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=a.c;x.fillRect(-a.s/2,-a.s/4,a.s,a.s/2);x.restore()});
    if(++n<110)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
function snowBurst(){confetti()}
// ---------- audio ----------
let au=null,ac=null,nb,mb=null,playing=false,mute=false,fxOn=true,tm;
function A(){
  if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const c=nb.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
  if(ac.state==="suspended")ac.resume();return ac}
const hz=n=>440*Math.pow(2,({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]]+12*(+n[1]+1)-69)/12);
function noise(t,dur,type,fr,vol){const a=A(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=nb;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random()*.3);s.stop(t+dur)}
function ping(t,fq,vol,dur){const a=A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=fq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}
function walkSfx(n){if(!fxOn)return;const t=A().currentTime+.05;for(let k=0;k<n;k++){noise(t+k*.28,.13,"lowpass",k%2?260:340,.6);if(k%2==0)[3200,4100,5000].forEach((f,j)=>ping(t+k*.28+j*.03,f,.025,.25))}}
function doorSfx(){
  if(!fxOn)return;const a=A(),t=a.currentTime+.02;
  noise(t,.05,"highpass",1800,.4);
  const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(75,t+.08);o.frequency.linearRampToValueAtTime(120,t+.55);o.frequency.linearRampToValueAtTime(85,t+1);
  f.type="bandpass";f.frequency.value=420;f.Q.value=5;
  g.gain.setValueAtTime(0,t+.08);g.gain.linearRampToValueAtTime(.18,t+.3);g.gain.linearRampToValueAtTime(0,t+1);
  l.frequency.value=16;lg.gain.value=.08;l.connect(lg);lg.connect(g.gain);
  o.connect(f);f.connect(g);g.connect(a.destination);o.start(t+.08);o.stop(t+1);l.start(t);l.stop(t+1);
  ping(t+.95,1318.5,.06,1.3);ping(t+1.05,1760,.04,1.3)}
// Silent Night (traditional, public domain), soft bell arrangement
const MEL="G4:3 A4:1 G4:2 E4:6 G4:3 A4:1 G4:2 E4:6 D5:3 D5:1 B4:2 C5:3 C5:1 G4:2 A4:2 A4:1 C5:1 B4:1 A4:1 G4:2 A4:1 G4:1 E4:2 A4:2 A4:1 C5:1 B4:1 A4:1 G4:2 A4:1 G4:1 E4:2 D5:2 D5:1 F5:1 D5:1 B4:1 C5:6 C5:2 C5:1 E5:1 C5:1 G4:1 G4:2 E4:1 G4:1 F4:1 D4:1 C4:6".split(" ");
const BAR="C C C C G C F C F C G C C G C".split(" ");
const CH={C:["C3","G3","E4"],G:["G2","D3","B3"],F:["F2","C3","A3"]};
const E8=.4;
function tone(t,fq,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=fq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(ty==="sine"?.015:.6));g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(mb);o.start(t);o.stop(t+d+.05)}
const BR=[];(()=>{let c=[],u=0;for(const q of MEL){const[n,x]=q.split(":");c.push([n,+x]);u+=+x;if(u>=6){BR.push(c);c=[];u=0}}})();
let bi=0;
function bar(){

  f("a_qq","Quiz question")+'<div class="g2">'+f("a_o0","Option 1")+f("a_o1","Option 2")+f("a_o2","Option 3")+'<label>Correct option<select id="a_qa"><option value="0">Option 1</option><option value="1">Option 2</option><option value="2">Option 3</option></select></label></div>'+
  '<div class="g2"><label>Mini game<select id="a_gt"><option value="">None</option><option value="scramble">Word guess</option><option value="tap">Gift catch (arcade)</option><option value="memory">Memory match</option></select></label>'+f("a_gw","Word guess: the word")+f("a_gh","Word guess: hint")+f("a_gg","Gift catch: points to score (default 10)")+'</div><label class="chk"><input type="checkbox" id="a_ul"> 🔓 Unlock this door now for everyone (for testing). Automatic date unlock still works.</label><br><button class="btn ghost" id="a_clr">Clear this door</button><button class="btn ghost" id="a_rl">Re-lock all manual unlocks</button></fieldset>'+
  '<fieldset><legend>Security &amp; preview</legend><label>New admin password (blank = keep current)<input type="password" id="a_np" autocomplete="new-password"></label><label>GitHub token (only for GitHub-hosted site; stays on this device, never saved in the page)<input type="password" id="a_tk" autocomplete="off" placeholder="github_pat_…"></label><label class="chk"><input type="checkbox" id="a_pvw"> Preview mode – unlock all doors on my screen only</label></fieldset>'+
  '<div style="text-align:center"><button class="btn" id="a_s">Save &amp; publish</button><button class="btn ghost" id="a_dl">Download file</button><button class="btn ghost" id="a_c">Close</button><button class="btn ghost" id="a_lo">Lock admin</button></div><p class="res" id="a_m" style="text-align:center"></p></div>';
  const v=id=>$("#"+id).value,m=t=>$("#a_m").textContent=t;
  $("#a_ch").value=D.church||"";$("#a_tg").value=D.tag||"";$("#a_sb").value=D.sub||"";$("#a_dt").value=D.dates||"";$("#a_ab").value=D.about||"";$("#a_ft").value=D.footer||"";$("#a_pvw").checked=preview;
  const load=i=>{cur=i;const d=D.days[i],q=d.qz||{o:[]},g=d.g||{};$("#a_d").value=i;$("#a_ul").checked=!!d.u;
    $("#a_t").value=d.t||"";$("#a_n").value=d.n||"";$("#a_q").value=d.q||"";$("#a_qq").value=q.q||"";
    [0,1,2].forEach(k=>$("#a_o"+k).value=(q.o||[])[k]||"");$("#a_qa").value=q.a||0;
    $("#a_gt").value=g.type||"";$("#a_gw").value=g.w||"";$("#a_gh").value=g.h||"";$("#a_gg").value=g.goal||""};
  const read=()=>{const d=D.days[cur];d.u=$("#a_ul").checked;d.t=v("a_t").trim();d.n=v("a_n");d.q=v("a_q");
    d.qz={q:v("a_qq"),o:[v("a_o0"),v("a_o1"),v("a_o2")],a:+v("a_qa")};d.g={type:v("a_gt"),w:v("a_gw"),h:v("a_gh"),goal:v("a_gg")}};
  const sw=i=>{read();load(Math.max(0,Math.min(D.days.length-1,i)))};
  load(0);const ro=()=>[...$("#a_d").options].forEach((o,k)=>{o.text=o.text.replace(/^🔓 /,"");if(D.days[k].u)o.text="🔓 "+o.text});ro();$("#a_ul").onchange=function(){D.days[cur].u=this.checked;ro()};$("#a_rl").onclick=()=>{D.days.forEach(d=>d.u=false);$("#a_ul").checked=false;ro();m("All manual unlocks removed – press Save & publish.")};$("#a_d").onchange=function(){sw(+this.value)};$("#a_pv0").onclick=()=>sw(cur-1);$("#a_nx").onclick=()=>sw(cur+1);
  $("#a_clr").onclick=()=>{D.days[cur]={u:false,t:"",n:"",q:"",qz:{q:"",o:["","",""],a:0},g:{type:""}};load(cur);m("Door cleared – press Save & publish.")};
  $("#a_im").onchange=async function(){const f=this.files[0];if(!f)return;try{pendImg=await shrink(f,1600);m("Photo ready. Press Save & publish.")}catch(e){m("Could not read that image.")}};
  $("#a_mu").onchange=function(){const f=this.files[0];if(!f)return;if(f.size>5*1024*1024){m("File too large (max 5 MB).");this.value="";return}const r=new FileReader();r.onload=()=>{pendMu=f.type&&f.type.startsWith("audio/")?r.result:r.result.replace(/^data:[^;]*;/,"data:audio/mpeg;");m("Music ready: "+f.name+". Press Save & publish.")};r.readAsDataURL(f)};
  $("#a_pvw").onchange=function(){preview=this.checked};
  $("#a_c").onclick=()=>{read();$("#modal").classList.remove("show");render()};
  $("#a_lo").onclick=()=>{unlocked=false;$("#modal").classList.remove("show");render()};
  const collect=async()=>{
    read();D.church=v("a_ch");D.tag=v("a_tg");D.sub=v("a_sb");D.dates=v("a_dt");D.about=v("a_ab");D.footer=v("a_ft");
    if($("#a_mr").checked){D.music="";au=null}if(pendMu){D.music=pendMu;au=null}if(pendImg)D.img=pendImg;
    const np=v("a_np");if(np){if(np.length<8){m("New password must be at least 8 characters.");return null}D.pw=await mkpw(np)}
    const json=JSON.stringify(D).replace(/</g,"\\u003c");
    return SRC.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(x,a,c)=>a+json+c)};
  $("#a_s").onclick=async()=>{const html=await collect();if(!html)return;try{await pub(html,m)}catch(e){m("Could not publish: "+(e.message||e.code||e))}};
  $("#a_dl").onclick=async()=>{const html=await collect();if(html){dl(html);m("Downloaded index.html – upload it to your host to publish.")}};
  $("#modal").classList.add("show")}
$("#adm").onclick=gate;
render();
</script></body></html>
